name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch article/opus/timeline from Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_ARTICLE_PATH: ${{ secrets.DROPBOX_ARTICLE_PATH }}
          DROPBOX_OPUS_PATH: ${{ secrets.DROPBOX_OPUS_PATH }}
          DROPBOX_TIMELINE_PATH: ${{ secrets.DROPBOX_TIMELINE_PATH }}
        run: python3 scripts/fetch-dropbox-content.py

      - name: Normalize opus assets to webp
        run: bash scripts/normalize-opus-assets.sh

      - name: Normalize timeline assets to webp/webm
        run: bash scripts/normalize-timeline-assets.sh

      - name: Verify opus assets
        run: |
          echo "Opus content files:"
          ls -la src/data/opus/content || true
          echo ""
          echo "Opus asset files:"
          ls -la src/data/opus/content/data || true
          count=$(ls -1 src/data/opus/content/data 2>/dev/null | wc -l | tr -d ' ')
          if [ "${count:-0}" -eq 0 ]; then
            echo "ERROR: No opus assets were synced to src/data/opus/content/data" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # @astrojs/node 利用時、静的成果物は dist/client
          path: 'dist/client'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
